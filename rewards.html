<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>متجر المكافآت 🎁</title>

    <!-- نفس خط الموقع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="rewards-page">
<a href="index.html" class="home-link">
     الرجوع للرئيسية
</a>
        <!-- الرجوع للطالبة -->
       <a href="student.html" class="rewards-back-btn" id="backToStudentBtn">
   → رجوع للطالبة 
</a>

        <!-- رأس المتجر -->
        <section class="rewards-header">

            <div>
                <p class="rewards-small-title"> مـتجـر عـباقـرة الريـاضيـات</p>
                <h1>متجر المكافآت 🎁</h1>
                <p>
                    اختاري المكافأة المناسبة واستبدليها بنقاط الطالبة
                </p>
            </div>

        </section>


        <!-- معلومات الطالبة -->
        <section class="reward-student-info">

            <div>
                <span>الطالبة</span>

                <h2 id="rewardStudentName">
                    اسم الطالبة
                </h2>
            </div>


            <div class="reward-student-balance">
                ⭐
                <strong id="rewardStudentPoints">0</strong>
                <span>نقطة</span>
            </div>

        </section>


        <!-- المكافآت -->
        <section class="rewards-section">
<div class="rewards-title">

    <div>
        <h2>✨ المكافآت</h2>
        <p>اختاري المكافأة التي تريدها الطالبة</p>
    </div>

    <button
        type="button"
        id="addRewardBtn"
        class="add-reward-btn"
    >
        + إضافة مكافأة
    </button>

</div>


            <div
                class="rewards-grid"
                id="rewardsGrid"
            >

                <!-- سنضيف المكافآت هنا بالجافاسكربت -->

            </div>

        </section>

        <!-- نافذة إضافة مكافأة -->
<div class="reward-modal" id="rewardModal">

    <div class="reward-modal-content">

        <button
            type="button"
            class="close-reward-modal"
            id="closeRewardModal"
        >
            ×
        </button>

        <h2 id="rewardModalTitle">🎁 إضافة مكافأة جديدة</h2>

        <label for="rewardName">اسم المكافأة</label>
        <input
            type="text"
            id="rewardName"
            placeholder="مثال: إعفاء من واجب"
        >

        <label for="rewardPoints">سعر المكافأة بالنقاط</label>
        <input
            type="number"
            id="rewardPoints"
            min="1"
            placeholder="مثال: 20"
        >

        <button
            type="button"
            id="saveRewardBtn"
            class="save-reward-btn"
        >
            إضافة المكافأة
        </button>

    </div>

</div>
    </main>


    <script src="script.js"></script>

</body>

</html>
